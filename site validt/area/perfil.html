<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu perfil | Validt</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body data-page="area-perfil" data-shell="app">
  <div class="app-frame">
    <div id="app-shell"></div>
    <div>
      <header class="app-top" id="app-top"></header>
      <main id="conteudo" class="app-main">
        <div class="banner">
          <div>
            <strong>Sem assinatura ativa</strong>
            <p class="meta">Assine um plano e tenha acesso ilimitado ao catálogo.</p>
          </div>
          <a class="btn btn-primary" href="../mentoria.html">Ver planos</a>
        </div>
        <h1>Meu perfil</h1>
        <form class="form" id="profile-form">
          <div class="form-grid">
            <label>Nome completo<input class="field" value="Aluno Exemplo" /></label>
            <label>E-mail<input class="field" value="aluno@validt.local" readonly /></label>
            <label>Profissão<input class="field" /></label>
            <label>Empresa<input class="field" /></label>
            <label>Cidade<input class="field" /></label>
            <label>Estado<input class="field" /></label>
            <label>Telefone<input class="field" /></label>
            <label>LinkedIn<input class="field" /></label>
            <label class="full">Nível de experiência<input class="field" placeholder="Ex: 5 anos" /></label>
          </div>
          <p class="kicker">Dados para contratos e certificados</p>
          <div>
            <button class="pill active" type="button" id="pf">Pessoa física</button>
            <button class="pill" type="button" id="pj">Pessoa jurídica</button>
          </div>
          <div class="form-grid" id="legal-fields"></div>
          <label class="stack-label full">Bio<textarea class="field" rows="5"></textarea></label>
          <button class="btn btn-primary" id="save-profile">Salvar alterações</button>
        </form>
        <section id="seguranca" class="section">
          <h2>Segurança</h2>
          <div class="form">
            <label>Senha atual<input class="field" type="password" /></label>
            <label>Nova senha<input class="field" type="password" /></label>
            <button class="btn btn-outline" type="button">Atualizar senha (mock)</button>
          </div>
        </section>
        <section id="notificacoes" class="section">
          <h2>Notificações</h2>
          <div class="tile">
            <label class="check"><input type="checkbox" checked /> Novos cursos</label>
            <label class="check"><input type="checkbox" checked /> Lembretes de estudo</label>
            <label class="check"><input type="checkbox" /> Ofertas</label>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages.js"></script>
</body>
</html>
