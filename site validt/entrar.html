<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar | Validt</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="entrar">
  <header id="site-header" class="site-header"></header>
  <main id="conteudo" class="wrap">
    <h1>Entrar</h1>
    <p class="lead">Login simulado. Qualquer e-mail e senha abrem a área do aluno.</p>
    <form class="form" id="auth-form" style="max-width:440px">
      <label>E-mail<input id="email" type="email" required value="aluno@validt.local" /></label>
      <label>Senha<input type="password" required value="demo" /></label>
      <button class="btn btn-primary" type="submit">Entrar</button>
      <p class="meta">Não tem conta? <a href="criar-conta.html">Criar conta</a></p>
    </form>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
