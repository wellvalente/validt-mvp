<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar conta | Validt</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="criar">
  <header id="site-header" class="site-header"></header>
  <main id="conteudo" class="wrap">
    <h1>Criar conta</h1>
    <p class="lead">Cadastro simulado para navegar a área do aluno.</p>
    <form class="form" id="auth-form" style="max-width:440px">
      <label>Nome<input required placeholder="Seu nome" /></label>
      <label>E-mail<input id="email" type="email" required /></label>
      <label>Senha<input type="password" required minlength="4" /></label>
      <button class="btn btn-primary" type="submit">Criar conta</button>
      <p class="meta">Já tem conta? <a href="entrar.html">Entrar</a></p>
    </form>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
