<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contato | Validt</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="contato">
  <header id="site-header" class="site-header"></header>
  <main id="conteudo" class="wrap">
    <p class="crumb"><a href="index.html">Início</a> / Contato</p>
    <p class="kicker">Fale conosco</p>
    <h1>Como podemos ajudar?</h1>
    <div class="split">
      <form class="form" id="contact-form">
        <label>Nome<input required name="nome" /></label>
        <label>E-mail<input required type="email" name="email" /></label>
        <label>Assunto<input required name="assunto" /></label>
        <label>Mensagem<textarea required maxlength="3000" rows="6"></textarea></label>
        <button class="btn btn-primary" type="submit">Enviar mensagem</button>
      </form>
      <aside class="tile">
        <p><strong>E-mail</strong><br>contato@validt.local</p>
        <p><strong>WhatsApp</strong><br>(mock) canal de suporte</p>
        <p><a class="btn btn-outline" href="mentoria.html">Ver mentoria</a></p>
      </aside>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
